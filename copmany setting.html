<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Company Settings</title>
    <!-- Google Font & Bootstrap 5 CSS & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style6.css">
</head>

<body>
    <!-- Top Header Navigation -->
    <header>
        <div class="logosec">
            <img class="logo-img" src="https://i.pinimg.com/736x/7b/26/78/7b2678ebab94467df19d47895624aa8e.jpg" alt="HCM Lite Logo">
        </div>

        <div class="searchbar">
            <input type="text" placeholder="Search settings..." />
            <i class="bi bi-search text-secondary ms-2"></i>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div class="text-end d-none d-sm-block">
                <div class="fw-semibold small text-white">Admin Portal</div>
                <div class="text-secondary small" style="font-size: 0.75rem;">admin@company.com</div>
            </div>
            <img src="https://i.pinimg.com/736x/7b/26/78/7b2678ebab94467df19d47895624aa8e.jpg" alt="Admin Avatar" class="logo-img">
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="navcontainer">
            <nav class="nav">
                <a href="./admin-dashboard.html" class="nav-option">
                    <i class="bi bi-shield-lock fs-5"></i>
                    <h3>Admin Dashboard</h3>
                </a>
                <a href="./employee management.html" class="nav-option">
                    <i class="bi bi-people fs-5"></i>
                    <h3>Employees</h3>
                </a>
                <a href="./leaves.html" class="nav-option">
                    <i class="bi bi-calendar-event fs-5"></i>
                    <h3>Leave Requests</h3>
                </a>
                <a href="./company-settings.html" class="nav-option active">
                    <i class="bi bi-gear fs-5"></i>
                    <h3>Company Settings</h3>
                </a>
                <a href="./index.html" class="nav-option text-danger mt-4">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                    <h3>Logout →</h3>
                </a>
            </nav>
        </div>

        <!-- Main Body Area -->
        <div class="main">
            <!-- Header CTA Bar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-0 text-white">Company Settings</h4>
                    <p class="text-secondary small m-0">Manage organization profile, work hours, and preferences.</p>
                </div>
            </div>

            <form action="#" method="POST">
                <!-- Organization Details Section -->
                <div class="settings-card">
                    <h6 class="fw-bold text-white mb-3"><i class="bi bi-building me-2 text-success"></i>Organization Profile</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small text-secondary">Company Name</label>
                            <input type="text" class="form-control form-control-sm" value="HCM Lite Technologies Inc.">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary">Company Email</label>
                            <input type="email" class="form-control form-control-sm" value="contact@company.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary">Phone Number</label>
                            <input type="tel" class="form-control form-control-sm" value="+1 (555) 234-5678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary">Tax / Registration ID</label>
                            <input type="text" class="form-control form-control-sm" value="REG-990214-X">
                        </div>
                        <div class="col-12">
                            <label class="form-label small text-secondary">Office Address</label>
                            <textarea class="form-control form-control-sm" rows="2">100 Tech Blvd, Suite 400, San Francisco, CA 94107</textarea>
                        </div>
                    </div>
                </div>

                <!-- Work Hours & Regional Policy Section -->
                <div class="settings-card">
                    <h6 class="fw-bold text-white mb-3"><i class="bi bi-clock-history me-2 text-warning"></i>Work Hours & Localization</h6>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small text-secondary">Standard Work Hours / Day</label>
                            <input type="number" class="form-control form-control-sm" value="8">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-secondary">Timezone</label>
                            <select class="form-select form-select-sm">
                                <option selected>UTC-08:00 (Pacific Time)</option>
                                <option>UTC+00:00 (Greenwich Mean Time)</option>
                                <option>UTC+05:00 (Pakistan Standard Time)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-secondary">Default Currency</label>
                            <select class="form-select form-select-sm">
                                <option selected>USD ($)</option>
                                <option>EUR (€)</option>
                                <option>GBP (£)</option>
                                <option>PKR (Rs)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Policy Preferences Section -->
                <div class="settings-card">
                    <h6 class="fw-bold text-white mb-3"><i class="bi bi-sliders me-2 text-info"></i>System Preferences</h6>
                    <div class="d-flex flex-column gap-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="autoApproveLeave" checked>
                            <label class="form-check-label text-white small" for="autoApproveLeave">Enable Auto-Approval for 1-Day Leave Requests</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                            <label class="form-check-label text-white small" for="emailNotif">Send Automated Email Alerts for Pending Approvals</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="requireReason">
                            <label class="form-check-label text-white small" for="requireReason">Require Mandatory Documentation for Sick Leave</label>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex justify-content-end gap-2 mb-4">
                    <button type="reset" class="btn btn-sm btn-outline-secondary px-3">Discard Changes</button>
                    <button type="submit" class="btn-emerald"><i class="bi bi-check2-circle"></i> Save Settings</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
